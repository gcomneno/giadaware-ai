name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/unit -v

      - name: Compile
        run: |
          python -m compileall -q src tests

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Installed-wheel smoke test
        run: |
          python -m venv /tmp/giadaware-ai-consumer
          /tmp/giadaware-ai-consumer/bin/pip install dist/*.whl
          cd /tmp
          /tmp/giadaware-ai-consumer/bin/python -c \
            "from giadaware_ai import AICapabilities, LogAnalysis, Severity; from giadaware_ai.backends import OllamaBackend; print('installed-wheel import OK')"
