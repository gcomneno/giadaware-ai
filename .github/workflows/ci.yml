name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/unit -v

      - name: Compile
        run: |
          python -m compileall -q src tests scripts

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Provision packaging tools
        run: |
          python -m pip install 'build>=1.2' 'setuptools>=68' wheel

      - name: Qualify wheel and source distribution offline
        run: |
          python scripts/qualify_distribution.py --output "dist/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Retain artifacts, checksums and build provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/ci-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
